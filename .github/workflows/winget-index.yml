name: Official WinGet catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
concurrency:
  group: winget-index-production
  cancel-in-progress: false
jobs:
  export-import:
    runs-on: windows-latest
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/winget-pkgs
          path: winget-manifests
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare official WinGet
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Microsoft.WinGet.Client -RequiredVersion 1.12.440 -Scope CurrentUser -Force -Repository PSGallery
          Import-Module Microsoft.WinGet.Client -RequiredVersion 1.12.440
          Repair-WinGetPackageManager -Version 1.29.380 -Force
      - name: Build catalogue exporter
        shell: pwsh
        run: |
          dotnet publish src/Kiosk.SetupHelper -c Release -r win-x64 --self-contained true -o index-tool
          if ($LASTEXITCODE -ne 0) { throw 'Cannot build exporter' }
      - name: Export structured catalogue
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exporter = Start-Process -FilePath './index-tool/KioskSetupHelper.exe' -ArgumentList @('export-index', 'winget-index.json', 'winget-manifests') -Wait -PassThru -NoNewWindow -RedirectStandardOutput 'winget-export.stdout.log' -RedirectStandardError 'winget-export.stderr.log'
          $exportExitCode = $exporter.ExitCode
          $exportExitHex = '0x{0:X8}' -f ([BitConverter]::ToUInt32([BitConverter]::GetBytes([int]$exportExitCode), 0))
          Write-Output "Exporter exit code: $exportExitCode ($exportExitHex)"
          foreach ($log in @('winget-export.stdout.log', 'winget-export.stderr.log')) {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
          }
          if ($exportExitCode -ne 0) { throw "Exporter failed (exit $exportExitCode, $exportExitHex). See winget-index-diagnostics artifact; keeping last good server catalogue." }
          if (-not (Test-Path -LiteralPath 'winget-index.json')) { throw 'Exporter returned success but no catalogue; keeping last good server catalogue.' }
      - name: Preserve export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winget-index-diagnostics
          path: |
            winget-export.stdout.log
            winget-export.stderr.log
            winget-index.json.diagnostics.log
          if-no-files-found: warn
          retention-days: 7
      - name: Import atomically
        shell: pwsh
        env:
          PUBLISH_KEY: ${{ secrets.KIOSK_RELEASE_PUBLISH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:PUBLISH_KEY) { throw 'Missing release publish key' }
          Invoke-RestMethod -Method Post -Uri 'https://panel.clinicapc.es/api/releases/winget-index' -Headers @{ 'X-Release-Publish-Key' = $env:PUBLISH_KEY } -ContentType 'application/json' -InFile winget-index.json | Out-Null
