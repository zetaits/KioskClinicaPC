name: Equipment Setup

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión independiente del asistente (X.Y.Z)
        required: true
        default: '1.5.7'
        type: string
      kiosk_version:
        description: Versión de Kiosk incluida (vacía usa la del proyecto)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: equipment-setup-production
  cancel-in-progress: false

jobs:
  build-test-publish-private:
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Test
        shell: pwsh
        run: dotnet test -c Release
      - name: Build both editions, diagnose sizes and publish a private candidate
        shell: pwsh
        env:
          EQUIPMENT_VERSION: ${{ inputs.version }}
          EQUIPMENT_KIOSK_VERSION: ${{ inputs.kiosk_version }}
          KIOSK_SERVER_URL: https://panel.clinicapc.es
          KIOSK_SERVER_API_KEY: ${{ secrets.KIOSK_SERVER_API_KEY }}
          KIOSK_INITIAL_SETUP_KEY: ${{ secrets.KIOSK_INITIAL_SETUP_KEY }}
          KIOSK_RELEASE_PUBLISH_KEY: ${{ secrets.KIOSK_RELEASE_PUBLISH_KEY }}
          KIOSK_UPDATE_SIGNING_KEY_ID: ${{ vars.KIOSK_UPDATE_SIGNING_KEY_ID }}
          KIOSK_UPDATE_SIGNING_PUBLIC_KEY: ${{ secrets.KIOSK_UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          $ready = Invoke-WebRequest 'https://panel.clinicapc.es/health/ready'
          if (($ready.Content | ConvertFrom-Json).status -ne 'ok' -or $ready.Headers['X-Setup-Catalog-Version'] -ne '3' -or $ready.Headers['X-Setup-Component-Protocol'] -ne '1' -or $ready.Headers['X-Kiosk-Password-Provisioning'] -ne '1') { throw 'Despliega primero el servidor con catálogo v3, protocolo de componentes 1 y aprovisionamiento de contraseña del panel.' }
          .\build-equipment-setup.ps1 -Version $env:EQUIPMENT_VERSION -KioskVersion $env:EQUIPMENT_KIOSK_VERSION -Publish
