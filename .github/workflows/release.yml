name: Release Kiosk

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: kiosk-production-release
  cancel-in-progress: false

jobs:
  build-sign-publish:
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Test
        shell: pwsh
        run: dotnet test -c Release
      - name: Build, sign, publish and import
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          KIOSK_UPDATE_SIGNING_KEY_ID: ${{ vars.KIOSK_UPDATE_SIGNING_KEY_ID }}
          KIOSK_UPDATE_SIGNING_PUBLIC_KEY: ${{ secrets.KIOSK_UPDATE_SIGNING_PUBLIC_KEY }}
          KIOSK_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.KIOSK_UPDATE_SIGNING_PRIVATE_KEY }}
          KIOSK_RELEASE_PUBLISH_KEY: ${{ secrets.KIOSK_RELEASE_PUBLISH_KEY }}
          KIOSK_SERVER_API_KEY: ${{ secrets.KIOSK_SERVER_API_KEY }}
          KIOSK_SERVER_URL: https://panel.clinicapc.es
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "El tag debe tener formato vX.Y.Z." }
          $version = $tag.TrimStart('v')
          .\build-installer.ps1 -Version $version -ServerUrl $env:KIOSK_SERVER_URL -Publish
