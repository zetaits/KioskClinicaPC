name: Release Kiosk

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: kiosk-production-release
  cancel-in-progress: false

jobs:
  build-sign-publish:
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Test
        shell: pwsh
        run: dotnet test -c Release
      - name: Build and sign
        shell: pwsh
        env:
          KIOSK_UPDATE_SIGNING_KEY_ID: ${{ vars.KIOSK_UPDATE_SIGNING_KEY_ID }}
          KIOSK_UPDATE_SIGNING_PUBLIC_KEY: ${{ secrets.KIOSK_UPDATE_SIGNING_PUBLIC_KEY }}
          KIOSK_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.KIOSK_UPDATE_SIGNING_PRIVATE_KEY }}
          KIOSK_SERVER_API_KEY: ${{ secrets.KIOSK_SERVER_API_KEY }}
          KIOSK_SERVER_URL: https://panel.clinicapc.es
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "El tag debe tener formato vX.Y.Z." }
          $version = $tag.TrimStart('v')
          .\build-installer.ps1 -Version $version -ServerUrl $env:KIOSK_SERVER_URL -PrepareRelease
      - name: Store signed release for VPS import retries
        shell: pwsh
        env:
          KIOSK_RELEASE_PUBLISH_KEY: ${{ secrets.KIOSK_RELEASE_PUBLISH_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          dotnet run --project tools/Kiosk.ReleaseTool -c Release -- protect $version installer/Output kiosk-release.enc
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo cifrar el artefacto de recuperación.' }
      - name: Upload encrypted recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-release-${{ github.ref_name }}
          path: kiosk-release.enc
          if-no-files-found: error
          retention-days: 90
      - name: Import into VPS
        shell: pwsh
        env:
          KIOSK_RELEASE_PUBLISH_KEY: ${{ secrets.KIOSK_RELEASE_PUBLISH_KEY }}
          KIOSK_SERVER_URL: https://panel.clinicapc.es
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $manifestPath = "installer/Output/kiosk-release-$version.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $setupPath = Join-Path 'installer/Output' $manifest.fileName
          $form = @{
            manifest = Get-Item -LiteralPath $manifestPath
            signature = Get-Content -LiteralPath "$manifestPath.sig" -Raw
            setup = Get-Item -LiteralPath $setupPath
          }
          Invoke-RestMethod -Method Post -Uri "$($env:KIOSK_SERVER_URL.TrimEnd('/'))/api/releases" `
            -Headers @{ 'X-Release-Publish-Key' = $env:KIOSK_RELEASE_PUBLISH_KEY } -Form $form | Out-Null
